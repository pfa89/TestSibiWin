version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing Node dependencies..."
      - npm ci
      # 🚀 NO BROWSER INSTALLATION NEEDED FOR API TESTS!
  build:
    commands:
      - echo "Running Playwright API tests..."
      - npx playwright test

# 🚀 AWS CodeBuild Reports Integration
reports:
  PlaywrightApiTestReports: # Name of the Report Group in AWS Console
    files:
      - 'results.xml' # Matches the junit reporter outputFile
    file-format: 'JUnitXML'

artifacts:
  files:
    - 'playwright-report/**/*'
  name: PlaywrightTestArtifacts